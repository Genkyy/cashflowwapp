name: Supabase Keep-Alive Heartbeat

on:
  schedule:
    # Berjalan otomatis setiap 3 hari sekali pukul 03:00 WIB (20:00 UTC)
    - cron: '0 20 */3 * *'
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di GitHub

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ping Supabase to Prevent Inactivity Pause
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://zcnbgwhlpfuhajhlzint.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_nYmcyZNojUuXYGx-qmckoA_3C-QkV2e' }}
        run: |
          cd bang-andi
          node scripts/supabase-keepalive.js
